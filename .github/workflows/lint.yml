name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Pinned to a compatible release. This was unpinned, and ruff 0.16.0
      # widened its implicit default rule set, which failed the build on a
      # docs-only commit. ruff.toml now names the rule set explicitly, so the
      # pin is only a second line of defence against a minor release adding
      # new rules under the E4/E7/E9/F prefixes.
      - name: Install ruff
        run: pip install "ruff~=0.16.0"

      - name: Run ruff
        run: |
          ruff --version
          ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # tests/headless runs the add-in's pure logic against hand-written adsk
      # stubs — no Fusion, no third-party packages, nothing to install. What it
      # cannot cover (real Fusion objects, the palette's Qt web view, docking)
      # still needs a PC test; see PC_VALIDATION.md.
      - name: Run headless tests
        working-directory: tests/headless
        run: python -m unittest discover --verbose

  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # The palette is plain HTML/CSS/JS, so its behaviour can be driven over
      # file:// with the same handler Fusion calls. This covers app.js, which
      # the unittest suite cannot reach at all.
      - name: Check the palette UI
        run: python tests/headless/palette_ui_check.py
