<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Constraint Lens</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="toolbar">
        <div class="status" id="status">Loading…</div>
        <button class="btn" id="highlight-under"
                title="Highlight underconstrained entities on the canvas"
                disabled>Show u/c</button>
        <button class="btn" id="refresh" title="Re-scan the active sketch">Refresh</button>
    </header>

    <div class="filter-bar">
        <input type="search" id="filter" placeholder="Filter by label or type…"
               autocomplete="off" spellcheck="false">
    </div>

    <main id="root">
        <div class="empty">Loading…</div>
    </main>

    <script src="app.js"></script>
</body>
</html>
