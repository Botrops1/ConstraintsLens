<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Constraint Lens</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sketch-name-bar">
        <div class="status" id="status">Loading…</div>
        <button class="btn" id="height-cycle"
                title="Docked height — click to cycle 50% / 75% / full">⇕ Full</button>
        <button class="btn" id="theme-toggle" title="Switch to light theme">☀</button>
    </div>
    <div class="toolbar">
        <button class="btn" id="clear-selection"
                title="Clear selection" style="display:none">Clear</button>
        <button class="btn danger" id="bulk-delete"
                title="Delete selected constraints" style="display:none">Delete 0</button>
        <button class="btn" id="highlight-under"
                title="Show underconstrained — highlights underconstrained entities on the canvas"
                disabled>Show u/c</button>
        <button class="btn" id="refresh" title="Re-scan the active sketch">Refresh</button>
    </div>

    <div id="selected-section" class="hidden">
        <div class="section-label" id="selected-label">
            <span id="selected-label-text">Selected:</span>
            <button id="autozoom-toggle" class="btn-icon"
                    title="Auto-zoom to selection (off)">⌕ Zoom</button>
        </div>
        <div id="entity-readout"></div>
        <div id="selected-divider" class="pane-divider"
             title="Drag to resize · double-click to reset"></div>
    </div>

    <div class="filter-bar">
        <button id="filter-clear" class="btn-filter-clear" title="Clear filter">✕</button>
        <input type="search" id="filter" placeholder="Filter by label or type…"
               autocomplete="off" spellcheck="false">
    </div>

    <main id="root">
        <div class="empty">Loading…</div>
    </main>

    <div id="footer-divider" class="pane-divider hidden"
         title="Drag to resize · double-click to reset"></div>

    <div id="footer-section" class="hidden">
        <div class="section-label section-label-footer">Properties of selected:</div>
        <footer id="selection-footer"></footer>
    </div>

    <div id="resize-grip" title="Drag to set the docked height">
        <span id="resize-grip-readout"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
